experimental = ["setup-scripts"]

# Downloads the kernel the VM suites boot, and tells them where it is. This
# filter must list the same suites as the `containers` override below, so a new
# suite that boots a VM goes in both.
[scripts.setup.prepare-integration]
command = { command-line = "bin/dev/prepare-integration", relative-to = "workspace-root" }
slow-timeout = { period = "120s", terminate-after = 5 }

[[profile.default.scripts]]
filter = 'binary(linux_container) | binary(linux_container_configuration) | binary(container_manager) | binary(vz_virtual_machine_manager) | binary(linux_pod)'
setup = 'prepare-integration'

# A VM per test: a dozen at once leaves the host swapping, and a starved guest
# looks like a hang.
[test-groups]
containers = { max-threads = 4 }

# Each container unpacks its image, and a cold store first pulls the image and
# the init image.
[[profile.default.overrides]]
filter = 'binary(linux_container) | binary(linux_container_configuration) | binary(container_manager) | binary(vz_virtual_machine_manager) | binary(linux_pod)'
test-group = 'containers'
slow-timeout = { period = "300s", terminate-after = 4 }

# A cold store pulls an image and the init image, and the registry suite
# reaches the registry the image is pulled from.
[[profile.default.overrides]]
filter = 'binary(content) | binary(image_store) | binary(ext4) | binary(registry_client)'
slow-timeout = { period = "300s", terminate-after = 4 }
