# A VM per test: a dozen at once leaves the host swapping, and a starved guest
# looks like a hang.
[test-groups]
containers = { max-threads = 4 }

# Each container unpacks its image, and a cold store first downloads a kernel
# and pulls the image and the init image.
[[profile.default.overrides]]
filter = 'binary(linux_container) | binary(configuration)'
test-group = 'containers'
slow-timeout = { period = "300s", terminate-after = 4 }

# A cold store pulls an image and the init image.
[[profile.default.overrides]]
filter = 'binary(content) | binary(image_store) | binary(ext4)'
slow-timeout = { period = "300s", terminate-after = 4 }
