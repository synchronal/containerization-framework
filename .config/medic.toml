[doctor]
checks = [
  {check = "homebrew"},
  {check = "tool-versions", command = "plugin-installed", args = {plugin = "rust"}},
  {check = "tool-versions", command = "package-installed", args = {plugin = "rust"}},
  {check = "rust", command = "crate-installed", args = {name = ["cargo-audit","cargo-outdated", "cargo-nextest"]}},
  {check = "rust", command = "target-installed", args = {target = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu"]}},
]

[test]
checks = [
  {name = "rust: test!", shell = "cargo nextest run --color always", verbose = true},
  {name = "rust: doctest!", shell = "cargo test --workspace --doc --color always", verbose = true},
]

[audit]
checks = [
  {name = "rust: audit", shell = "cargo audit", verbose = true},
  {name = "rust: check", shell = "cargo check --all-targets --features integration,strict --color always", remedy = "cargo fix --allow-dirty"},
  {name = "rust: check off macOS", shell = "cargo check --all-targets --features integration,strict --target aarch64-unknown-linux-gnu --color always"},
  {name = "rust: clippy", shell = "cargo clippy --all-targets --features integration -- -D warnings", remedy = "cargo clippy --all-targets --features integration --fix --allow-dirty"},
  {check = "rust", command = "format-check"},
  {name = "swift: format", shell = "bin/dev/format-swift --check", remedy = "bin/dev/format-swift --all"},
  {name = "swift: lint", shell = "bin/dev/lint-swift"},
]

[outdated]
checks = [
  {check = "rust"},
]

[update]
steps = [
  {step = "git", command = "pull"},
  {doctor = {}},
]

[shipit]
steps = [
  {audit = {}},
  {update = {}},
  {test = {}},
  {name = "rust: integration!", shell = "bin/dev/test-integration", verbose = true},
  {step = "git", command = "push"},
]

