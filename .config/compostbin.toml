[claude]
seed_from_keychain = true

[container]
cpus = 4
env = []
memory = "8G"

[host]
clipboard = true

[host.commands.audit]
argv = ["cargo", "audit"]

[host.commands.check]
argv = ["cargo", "check", "--all-targets", "--features", "integration"]

# Off macOS the bridge is compiled out, so code only Swift calls is dead there.
# This only type-checks, so the target needs no linker.
[host.commands.check-linux]
argv = ["cargo", "check", "--all-targets", "--features", "integration,strict", "--target", "aarch64-unknown-linux-gnu"]

# The integration feature compiles the integration tests, so they are linted
# without booting a VM.
[host.commands.clippy]
argv = ["cargo", "clippy", "--all-targets", "--features", "integration", "--", "-D", "warnings"]

[host.commands.doctest]
argv = ["cargo", "test", "--workspace", "--doc"]
tty = true

[host.commands.fmt]
argv = ["cargo", "fmt", "--all"]

[host.commands.swift-fmt]
argv = ["bin/dev/format-swift", "--all"]

[host.commands.swift-lint]
argv = ["bin/dev/lint-swift"]

# Exact: no arguments, the whole suite.
[host.commands.test]
argv = ["cargo", "nextest", "run"]
tty = true

[host.commands.test-integration]
argv = ["bin/dev/test-integration"]
tty = true

# Widened deliberately, for the iterate-on-one-failing-test loop.
[host.commands.test-one]
arguments = true
argv = ["cargo", "nextest", "run"]
deny = ["--config", "--manifest-path", "-Z", "-p"]
tty = true

[project]
image = "compostbin/base:latest"
name = "containerization"

[workspace]
roots = []
